[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-benchmark"
version = "0.1.0"
description = "Audio representation learning benchmark suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "torch==2.8.0",
    "pytest>=9.1.1",
    "tqdm>=4.60.0",
    "torchaudio==2.8.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_benchmark*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
